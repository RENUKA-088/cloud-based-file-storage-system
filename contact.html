    <meta charset="UTF-8">

    <title>Contact Renuka | Web Developer</title>

</head>

<body>

    <header>
        <nav aria-label="Main navigation">

            <a href="index.html">Renuka</a>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" aria-current="page">Contact</a>

        </nav>
    </header>

    <main>

        <section aria-labelledby="contact-heading">

            <h1 id="contact-heading">Contact Me</h1>

            <p>
                If you would like to get in touch, please fill out
                the form below.
            </p>

            <form action="#" method="post">

                <div>
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required>
                </div>

                <br>

                <div>
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>
                </div>

                <br>

                <div>
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required>
                </div>

                <br>

                <div>
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required></textarea>
                </div>

                <br>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>
