<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud File Storage System</title>
    <meta name="description" content="A simple cloud based file storage system for uploading and managing files.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Cloud Based File Storage System</h1>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="storage.html">File Storage</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <section aria-labelledby="storage-title">
        <h2 id="storage-title">My Cloud Storage</h2>

        <p>Upload and manage your files easily.</p>

        <form>
            <label for="fileUpload">Choose a file:</label>
            <input type="file" id="fileUpload" name="fileUpload">

            <button type="button" onclick="uploadFile()">
                Upload File
            </button>
        </form>
    </section>

    <section aria-labelledby="files-title">
        <h2 id="files-title">My Files</h2>

        <div id="fileList">
            <p>No files uploaded yet.</p>
        </div>
    </section>

</main>

<footer>
    <p>&copy; 2026 Cloud Based File Storage System</p>
</footer>

<script>
function uploadFile() {
    const fileInput = document.getElementById("fileUpload");
    const fileList = document.getElementById("fileList");

    if (fileInput.files.length === 0) {
        alert("Please choose a file first.");
        return;
    }

    const file = fileInput.files[0];

    const fileItem = document.createElement("p");
    fileItem.textContent =
        "File selected: " + file.name +
        " (" + Math.round(file.size / 1024) + " KB)";

    fileList.innerHTML = "";
    fileList.appendChild(fileItem);
}
</script>

</body>
</html>
